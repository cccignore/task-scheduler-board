[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scheduler-board"
version = "1.0.0"
description = "A concurrency-safe task scheduler and live status dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<0.129",
    "uvicorn>=0.30,<0.40",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
